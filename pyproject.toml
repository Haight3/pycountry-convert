[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pycountry-convert-ng"
version = "2026.9.0.0"
description = "Fast country, ISO code, and continent conversion utilities."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "TUNE Inc., TuneLab" },
]
maintainers = [
    { name = "Haight UG" },
]
keywords = ["country", "continent", "iso-3166", "geography"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Haight3/pycountry-convert"
Repository = "https://github.com/Haight3/pycountry-convert"
Issues = "https://github.com/Haight3/pycountry-convert/issues"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "bumpver>=2023.1129",
    "pre-commit>=4.0",
    "pytest>=8.4",
    "pytest-cov>=6.0",
    "ruff>=0.14",
    "twine>=6.1",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pycountry_convert*"]

[tool.pytest.ini_options]
addopts = [
    "-ra",
    "--strict-markers",
    "--tb=short",
]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.bumpver]
current_version = "2026.9.0.0"
version_pattern = "YYYY.MM.INC0.PATCH"
commit_message = "ver(pycountry-convert-ng): bump version from {old_version} -> {new_version}"
commit = true
tag = false
push = true

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    'version = "{version}"',
    'current_version = "{version}"',
]
"src/pycountry_convert/__init__.py" = [
    "__version__ = '{version}'",
]

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = ["data", "examples"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"src/pycountry_convert/__init__.py" = ["F401"]
"tests/*.py" = ["F401"]
