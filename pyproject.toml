[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pycountry-convert-ng"
version = "2026.9.1"
description = "Extension of Python package pycountry providing conversion functions."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Haight Labs" },
    { name = "TUNE Inc., TuneLab" },
]
maintainers = [
    { name = "Haight Labs" },
]
keywords = ["country", "continent", "iso-3166", "geography"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pycountry>=24.6.1",
]

[project.urls]
Homepage = "https://github.com/Haight3/pycountry-convert"
Repository = "https://github.com/Haight3/pycountry-convert"
Issues = "https://github.com/Haight3/pycountry-convert/issues"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "bumpver>=2023.1129",
    "pre-commit>=4.0",
    "pytest>=8.4",
    "pytest-cov>=6.0",
    "ruff>=0.16.1",
    "twine>=6.1",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pycountry_convert*"]

[tool.pytest.ini_options]
addopts = [
    "-ra",
    "--strict-markers",
    "--tb=short",
]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.bumpver]
current_version="2026.9.1"
version_pattern = "YYYY.MM.PATCH"
commit_message = "ver(pycountry-convert): bump version from {old_version} -> {new_version}"
commit = true
tag = false
push = true
version_regex = "(?P<year>[0-9]{4})\\.(?P<month>[0-9]{1,2})\\.(?P<patch>[0-9]+)"
version_replacement = "{year}.{month}.{patch}"

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    'version = "{version}"',
    'current_version="{version}"',
]
"src/pycountry_convert/__init__.py" = [
    '__version__ = "{version}"',
]

[tool.ruff]
line-length = 140
extend-exclude = ["resources/scripts/deploy.py"]
preview = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "any-type",
    "missing-trailing-comma",
    "missing-blank-line-after-summary",
    "multi-line-summary-second-line",
    "missing-trailing-period",
    "non-imperative-mood",
    "missing-blank-line-after-last-section",
    "missing-terminal-punctuation",
    "EM",
    "raw-string-in-exception",
    "commented-out-code",
    "boolean-type-hint-positional-argument",
    "boolean-default-value-positional-argument",
    "too-many-arguments",
    "PTH",
    "unnecessary-assign",
    "print",
    "raise-vanilla-args",
    "complex-structure",
    "too-many-positional-arguments",
    "magic-value-comparison",
    "camelcase-imported-as-acronym",
    "non-empty-init-module",
]

[tool.ruff.lint.per-file-ignores]
"resources/docs/conf.py" = ["builtin-variable-shadowing", "undocumented-public-module", "implicit-namespace-package", "bad-quotes-inline-string", "utf8-encoding-declaration", "format-literals", "printf-string-formatting", "f-string", "unsorted-imports", "missing-trailing-comma"]
"resources/scripts/*.py" = ["undocumented-public-module", "implicit-namespace-package", "utf8-encoding-declaration"]
"src/pycountry_convert/__init__.py" = ["unused-import"]
"src/pycountry_convert/country_name_to_country_alpha2.py" = ["docstring-extraneous-exception"]
"tests/*.py" = ["missing-return-type-undocumented-public-function", "undocumented-public-module", "undocumented-public-function", "implicit-namespace-package", "map-int-version-parsing", "assert", "incorrect-dict-iterator", "unused-loop-control-variable", "magic-value-comparison", "non-lowercase-variable-in-function", "import-outside-top-level", "missing-return-type-private-function", "missing-copyright-notice"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
