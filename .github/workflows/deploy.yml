name: Build and Release

on:
  workflow_dispatch:

  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-latest

    outputs:
      package-version: ${{ steps.package.outputs.version }}
      release-tag: ${{ steps.package.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Read package metadata
        id: package
        shell: bash
        run: |
          PACKAGE_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          RELEASE_TAG="v${PACKAGE_VERSION}"

          echo "version=${PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Verify release tag does not already exist
        shell: bash
        run: |
          TAG="${{ steps.package.outputs.tag }}"
          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Release tag ${TAG} already exists. Increment the version before releasing."
            exit 1
          fi

  build:
    name: Build distributions
    needs: prepare-release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install --upgrade pip build twine

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  verify-installation:
    name: Verify release installation
    needs:
      - prepare-release
      - build
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist

      - name: Install built wheel
        shell: bash
        run: python -m pip install dist/*.whl

      - name: Smoke test installed package
        run: python -c "import pycountry_convert as pc; assert pc.convert_country_alpha2_to_continent('DE') == 'Europe'; assert pc.convert_country_alpha3_to_country_alpha2('DEU') == 'DE'"

  publish-pypi:
    name: Publish to PyPI
    needs:
      - build
      - verify-installation
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pycountry-convert-ng/

    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-release:
    name: Publish GitHub Release
    needs:
      - prepare-release
      - publish-pypi
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist

      - name: Extract changelog entry
        shell: bash
        env:
          VERSION: ${{ needs.prepare-release.outputs.package-version }}
        run: |
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { found=1 }
            found && /^## \[/ && $0 !~ "^## \\[" version "\\]" { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md

          if [ ! -s RELEASE_NOTES.md ]; then
            echo "Release ${VERSION}" > RELEASE_NOTES.md
          fi

      - name: Create Git tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${{ needs.prepare-release.outputs.release-tag }}" dist/* \
            --target "${{ github.sha }}" \
            --title "${{ needs.prepare-release.outputs.release-tag }}" \
            --notes-file RELEASE_NOTES.md
